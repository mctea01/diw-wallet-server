name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # The Cloudflare Worker in deploy/cloudflare.
          - language: javascript-typescript
            build-mode: none
          # The server's own Kotlin in src/. The wallet is pulled in only as a build
          # dependency (includeBuild) and is scanned in its own repository, so its code
          # is excluded from the results below.
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Only the Kotlin build needs the wallet submodule (the included build); the
          # other languages scan the server's own files only.
          submodules: ${{ matrix.language == 'java-kotlin' }}

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Verify Java/Kotlin build environment
        if: matrix.language == 'java-kotlin'
        run: |
          java -version
          test -f wallet/settings.gradle.kts
          test -n "${ANDROID_HOME:-}"
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          # The wallet submodule is a build dependency only and is scanned in its own
          # repository; generated output and docs carry no findings worth reporting.
          config: |
            paths-ignore:
              - wallet/**
              - docs/**
              - '**/build/**'

      # Compiling the server also configures the included wallet build, so the Android
      # SDK on the runner is required; the Rust native library is skipped.
      - name: Build Java/Kotlin
        if: matrix.language == 'java-kotlin'
        env:
          DIW_ZK_NATIVE: skip
        run: |
          chmod +x ./gradlew
          ./gradlew \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace \
            classes testClasses

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
