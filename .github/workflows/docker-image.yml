# Tests every push to main and every pull request; a v* tag also publishes the container image to GHCR and
# attaches the distribution (with its Java runtime) to a GitHub release.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  packages: write

env:
  LANG: C.UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
  # The zkTLS verifier host needs TLSNotary; OpenAC serves bonds_age_verify. A missing toolchain fails the build.
  DIW_ZK_NATIVE: require
  DIW_ZK_FEATURES: openac,tlsn

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      # The wallet's core module has an Android target; the runner image's preinstalled SDK (ANDROID_HOME) is enough.
      # android-actions/setup-android@v3 fails with cmdline-tools 16.0, which no longer has the "tools" package.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # Rust is on the runner image; wallet/native/rust-toolchain.toml installs the pinned version on first use.
      - name: Native build tools (protoc and libclang for OpenAC)
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler libclang-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: wallet/native -> target
      - name: Test and build the distributions
        run: ./gradlew --no-daemon --stacktrace test installDist distTar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution
          path: build/distributions/*.tar
          retention-days: 14

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push the image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" build/distributions/*.tar --title "${GITHUB_REF_NAME}" --generate-notes
