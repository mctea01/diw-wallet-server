# Tests every push to main and every pull request; a v* tag also publishes the container image to GHCR and
# attaches the distribution tarball to a GitHub release.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  packages: write

env:
  LANG: C.UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
  # The relay needs no native proof library; S2 switches this to require with DIW_ZK_FEATURES=tlsn.
  DIW_ZK_NATIVE: skip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The wallet's core module has an Android target; the runner image's preinstalled SDK (ANDROID_HOME) is enough.
      # android-actions/setup-android@v3 fails with cmdline-tools 16.0, which no longer has the "tools" package.
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the distribution
        run: ./gradlew test installDist distTar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: build/distributions/*.tar
          retention-days: 14

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push the image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" build/distributions/*.tar --title "${GITHUB_REF_NAME}" --generate-notes
