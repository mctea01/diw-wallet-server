# Tests every push to main and every pull request; a v* tag also publishes the container image to GHCR and
# attaches the distribution (with its Java runtime) to a GitHub release.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  packages: write

env:
  LANG: C.UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
  # The zkTLS verifier host needs TLSNotary; OpenAC serves bonds_age_verify. A missing toolchain fails the build.
  DIW_ZK_NATIVE: require
  DIW_ZK_FEATURES: openac,tlsn

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      # The wallet's core module has an Android target; the runner image's preinstalled SDK (ANDROID_HOME) is enough.
      # android-actions/setup-android@v3 fails with cmdline-tools 16.0, which no longer has the "tools" package.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      # Rust is on the runner image; wallet/native/rust-toolchain.toml installs the pinned version on first use.
      - name: Native build tools (protoc and libclang for OpenAC)
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallet/native -> target
      - name: Test and build the distributions
        run: ./gradlew --no-daemon --stacktrace test installDist distTar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distribution
          path: build/distributions/*.tar
          retention-days: 14

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push the image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" build/distributions/*.tar --title "${GITHUB_REF_NAME}" --generate-notes
