# Production deployment: the server behind Caddy, which obtains and renews the TLS certificate by itself.
# Both read ./server.conf, the same settings file a manual install uses (cp deploy/server.conf.example server.conf,
# set DIW_PUBLIC_URL and DIW_ACME_EMAIL). Optional .env: DIW_VERSION (image tag), DIW_MEMORY_LIMIT, DIW_JAVA_OPTS.
# Then: docker compose up -d
services:
  server:
    image: ghcr.io/mctea01/diw-wallet-server:${DIW_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: ./server.conf
        required: true
    environment:
      # Only defaults change with the platform: listen on 0.0.0.0 and trust Caddy's forwarded client address.
      DIW_PLATFORM: compose
      JAVA_OPTS: ${DIW_JAVA_OPTS:--Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m}
    volumes:
      - server-data:/var/lib/diw-server
    expose:
      - "8080"
    mem_limit: ${DIW_MEMORY_LIMIT:-700m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # DIW_PUBLIC_URL names the site and DIW_ACME_EMAIL the certificate contact.
    env_file:
      - path: ./server.conf
        required: true
    environment:
      DIW_UPSTREAM: server:8080
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  server-data:
  caddy-data:
  caddy-config:
