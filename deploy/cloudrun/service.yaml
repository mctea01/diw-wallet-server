# Cloud Run service (gcloud run services replace deploy/cloudrun/service.yaml --region asia-east1).
# Replace IMAGE first; see README "Cloud Run". Cloud Run terminates TLS itself, so no Caddy.
# The settings are the same server.conf every other deployment uses, kept whole in Secret Manager:
#   gcloud secrets create diw-server-conf --data-file=server.conf
# Keys go into that file as DIW_SIGNING_KEY_PEM=... (one line, \n for line breaks), since the disk does not survive
# a cold start and a generated key would change.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: diw-wallet-server
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Both parties of a relay room must reach the same instance, so never run more than one.
        autoscaling.knative.dev/maxScale: "1"
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/sessionAffinity: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      # Relay connections are WebSocket requests; allow them the longest request time.
      timeoutSeconds: 3600
      containerConcurrency: 200
      containers:
        - image: IMAGE
          ports:
            - name: http1
              containerPort: 8080
          env:
            # Only defaults change with the platform: listen on 0.0.0.0 and the PORT Cloud Run names, trust Google's
            # X-Forwarded-For, keep data in /tmp/diw-server and never generate keys there.
            - name: DIW_PLATFORM
              value: cloudrun
            - name: JAVA_OPTS
              value: -Xmx384m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m
          volumeMounts:
            - name: settings
              mountPath: /etc/diw-server
              readOnly: true
          resources:
            limits:
              cpu: "1"
              # One zkTLS verification peaked near 350 MB with the holder in the same JVM; 1 GiB leaves room.
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
            periodSeconds: 30
      volumes:
        - name: settings
          secret:
            secretName: diw-server-conf
            items:
              - key: latest
                path: server.conf
