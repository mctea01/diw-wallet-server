# Cloud Run service (gcloud run services replace deploy/cloudrun/service.yaml --region asia-east1).
# Replace IMAGE, PUBLIC_URL and TOKEN_SHA256 first; see README "Cloud Run". Cloud Run terminates TLS itself, so no Caddy.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: diw-wallet-server
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Both parties of a relay room must reach the same instance, so never run more than one.
        autoscaling.knative.dev/maxScale: "1"
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/sessionAffinity: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      # Relay connections are WebSocket requests; allow them the longest request time.
      timeoutSeconds: 3600
      containerConcurrency: 200
      containers:
        - image: IMAGE
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: DIW_PUBLIC_URL
              value: PUBLIC_URL
            # Add verifier for the web verifier (and uncomment DIW_VERIFIER_KEY_PEM below).
            - name: DIW_FEATURES
              value: relay,zktls,bonds-age
            # SHA-256 of the zkTLS access token: printf '%s\n' "$TOKEN" | diw-server hash-token
            - name: DIW_ZKTLS_TOKEN_SHA256
              value: TOKEN_SHA256
            # The disk is lost on every cold start, so the keys come from Secret Manager (see README "Cloud Run");
            # a generated key would change and the wallet would ask the user to trust the server again.
            - name: DIW_SIGNING_GENERATE
              value: "false"
            - name: DIW_SIGNING_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: diw-signing-key
                  key: latest
            # - name: DIW_VERIFIER_KEY_PEM
            #   valueFrom:
            #     secretKeyRef:
            #       name: diw-verifier-key
            #       key: latest
            # Mobile citizen certificate signing (add twfido to DIW_FEATURES): the SP account from the Ministry of
            # the Interior, its AES key in Secret Manager (gcloud secrets create diw-twfido-key --data-file=-), and the
            # SHA-256 of the signing access token (unset: the zkTLS one). DIW_TWFIDO_ENVIRONMENT=uat for a test account.
            # - name: DIW_TWFIDO_SERVICE_ID
            #   value: SP_SERVICE_ID
            # - name: DIW_TWFIDO_TOKEN_SHA256
            #   value: TOKEN_SHA256
            # - name: DIW_TWFIDO_AES_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: diw-twfido-key
            #       key: latest
            # Google's front end sets X-Forwarded-For; the container is reachable only through it.
            - name: DIW_TRUST_FORWARDED
              value: "true"
            - name: DIW_DATA_DIR
              value: /tmp/diw-server
            - name: JAVA_OPTS
              value: -Xmx384m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m
          resources:
            limits:
              cpu: "1"
              # One zkTLS verification peaked near 350 MB with the holder in the same JVM; 1 GiB leaves room.
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
            periodSeconds: 30
