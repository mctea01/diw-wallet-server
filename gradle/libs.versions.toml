[versions]
kotlin = "2.2.21"
ktor = "3.3.3"
coroutines = "1.10.2"
serialization = "1.9.0"
# Kept in step with the wallet (wallet/gradle/libs.versions.toml).
bouncycastle = "1.85"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
# Ktor 3.3.3 brings Netty 4.2.7, which has request smuggling and SNI bypass advisories fixed in 4.2.17.
netty-bom = { module = "io.netty:netty-bom", version = "4.2.19.Final" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-forwarded-header = { module = "io.ktor:ktor-server-forwarded-header", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
zxing-core = { module = "com.google.zxing:core", version = "3.5.4" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version = "2.0.20" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
