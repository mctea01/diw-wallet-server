[versions]
kotlin = "2.4.21"
ktor = "3.6.0"
coroutines = "1.11.0"
serialization = "1.12.0"
# Kept in step with the wallet (wallet/gradle/libs.versions.toml).
bouncycastle = "1.86"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
# CIO, not Netty: the one engine Ktor supports in a GraalVM native image, so the JVM and native builds serve alike.
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-forwarded-header = { module = "io.ktor:ktor-server-forwarded-header", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
zxing-core = { module = "com.google.zxing:core", version = "3.5.4" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version = "2.0.20" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# GraalVM native image (nativeCompile); needs a GraalVM JDK in GRAALVM_HOME only when that task runs.
graalvm-native = { id = "org.graalvm.buildtools.native", version = "0.10.6" }
